name: audit

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 2,6'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: rust aqua:EmbarkStudios/cargo-deny
      - name: Check dependencies and licenses
        run: mise run deny
